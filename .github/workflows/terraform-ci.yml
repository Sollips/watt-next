name: terraform-ci

on:
  pull_request:          # every PR, whichever branch it targets
  workflow_dispatch:     # a "Run workflow" button for manual runs

permissions:
  contents: read         # least privilege: the job can only READ the repo

jobs:
    tflint:
     name: Lint (tflint)
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v6
      - name: tflint (same image as local, pinned)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # avoids GitHub API rate limits when downloading the AWS plugin
        run: |
          docker run --rm -v "$PWD:/data" -w /data -e GITHUB_TOKEN --entrypoint sh \
            ghcr.io/terraform-linters/tflint:v0.65.0 \
            -c "tflint --init --config /data/.tflint.hcl && tflint --recursive --config /data/.tflint.hcl --format compact"

  checkov:
    name: Security scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: checkov (same image as local, pinned)
        run: docker run --rm -v "$PWD:/tf" -w /tf bridgecrew/checkov:3.4.3 --config-file /tf/.checkov.yaml -d /tf
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6               # verify the current major on its GitHub page
      - uses: hashicorp/setup-terraform@v3      # verify the current major on its GitHub page
        with:
          terraform_version: "1.16.0"           # same version as your laptop
      - run: terraform fmt -check -recursive    # fails if any .tf file isn't formatted

  plan:
    name: Plan (infra)
    needs: [fmt, validate, tflint, checkov]                    # don't log into AWS if the code is broken
    if: github.event_name == 'pull_request'   # only PRs match the ci-plan trust policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                         # lets the job ask GitHub for an OIDC token
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}   # replaces the gitignored local.auto.tfvars
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v5   # verify the latest major on the Marketplace
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=60s -var-file=dev.tfvars -no-color 
    
  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra, bootstrap]                 # one job per config, in parallel
    defaults:
      run:
        working-directory: ${{ matrix.dir }}    # every command runs inside that folder
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - run: terraform init -backend=false -input=false   # providers + modules, no state
      - run: terraform validate
  
  apply:
    name: Apply (infra)
    needs: [fmt, validate, tflint, checkov]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production                   # the approval gate (works once the repo is public)
    concurrency:
      group: terraform-apply                  # never two applies at once
      cancel-in-progress: false               # never kill an apply halfway
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=60s -var-file=dev.tfvars -no-color -out=tfplan
      - run: terraform apply -input=false -lock-timeout=60s -no-color tfplan   # applies exactly what was just planned
